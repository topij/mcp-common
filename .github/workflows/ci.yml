name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          # Match the python:3.12-slim base image the servers deploy on.
          python-version: "3.12"

      - name: Sync and test
        run: |
          uv sync --extra dev
          uv run python -m pytest tests/ -v --cov=mcp_common --cov-report=term-missing

      - name: Lint
        run: uv run ruff check mcp_common/ tests/

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
