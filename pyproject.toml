[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_common"]

[project]
name = "mcp-common"
version = "0.1.1"
description = "Shared primitives for the home-server MCP servers — embedding client, input caps, untrusted-content framing, SSE auth middleware, settings"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

# Deliberately light. `mcp` itself is NOT a dependency: serve.run_sse() duck-types
# the FastMCP object it is handed, so this library never pins the MCP SDK version
# its consumers are on.
dependencies = [
    "openai>=1.0.0",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
# Only needed by CloudflareAccessVerifier; imported lazily so shared-secret-only
# deployments never pull the crypto stack.
cloudflare = [
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0",
    "ruff>=0.11.0",
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
